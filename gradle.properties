# Increase memory for building several Minecraft versions.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties
mod_version=1.0.0
maven_group=online.slavok
archives_base_name=friendly-phantoms

# Fabric (loader is Minecraft-version independent; kept low at runtime via fabric.mod.json)
loader_version=0.19.3

# Modrinth project id (replace after creating the project on modrinth.com).
# The token is provided via the MODRINTH_TOKEN environment variable / CI secret.
modrinth_id=CHANGEME
