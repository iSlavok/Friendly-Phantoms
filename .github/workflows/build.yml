# Builds every Stonecutter version on each push/PR. A single `./gradlew build`
# chisels, builds and gametests all declared Minecraft versions.
name: build
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Yarn-mapped versions (1.18.2 – 1.21.8) build and gametest on JDK 21.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and gametest
        run: ./gradlew build :1.21.8:runGameTest --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/*.jar
          if-no-files-found: error

  # Minecraft 26+ is unobfuscated and requires JDK 25.
  build-unobfuscated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and gametest 26.2
        run: ./gradlew :26.2:build :26.2:runGameTest --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars-unobfuscated
          path: versions/26.2/build/libs/*.jar
          if-no-files-found: error
