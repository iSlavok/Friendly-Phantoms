# Publishes a release when a `v*` tag is pushed:
#   1. builds every declared Minecraft version
#   2. attaches all jars to a GitHub Release
#   3. publishes each version to Modrinth (needs `modrinth_id` set in
#      gradle.properties and the MODRINTH_TOKEN repository secret)
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 25 so the unobfuscated 26+ anchors are included in the build; JDK 21
      # for the server plugin's Java toolchain. JAVA_HOME points at the last (25).
      - name: Set up JDK 21 & 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Version comes from the tag (v1.0.2 -> 1.0.2), overriding mod_version.
      # workflow_dispatch has no tag, so fall back to the gradle.properties default.
      - name: Resolve version from tag
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "arg=-Pmod_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all mod versions
        run: ./gradlew assemble ${{ steps.ver.outputs.arg }} --stacktrace

      # The server plugin is a standalone build, not part of the mod version grid.
      - name: Build plugin
        run: ./gradlew -p plugin assemble ${{ steps.ver.outputs.arg }} --stacktrace

      # softprops/action-gh-release has no exclude patterns, so stage only the
      # loadable mod jars (drop *-sources.jar) and upload from there.
      - name: Collect release jars
        run: |
          mkdir -p release-jars
          find versions -path '*/build/libs/*.jar' ! -name '*-sources.jar' -exec cp {} release-jars/ \;
          find plugin/build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} release-jars/ \;
          ls -la release-jars

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Publish mods to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods ${{ steps.ver.outputs.arg }} --stacktrace

      - name: Publish plugin to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew -p plugin publishMods ${{ steps.ver.outputs.arg }} --stacktrace
